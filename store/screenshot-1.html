<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 800px; }
  body {
    font-family: "Hiragino Sans", "Noto Sans CJK JP", sans-serif;
    background: linear-gradient(135deg, #eef2f7 0%, #dde5ef 100%);
    color: #1f2933;
    padding: 56px 64px;
  }
  h1 { font-size: 44px; font-weight: 700; letter-spacing: 0.02em; }
  .lead { margin-top: 12px; font-size: 22px; color: #52606d; }
  .main { margin-top: 40px; display: flex; gap: 48px; align-items: flex-start; }
  .menu {
    flex: none;
    width: 640px;
    border-radius: 16px;
    background: #3c3c3c;
    padding: 12px;
    box-shadow: 0 12px 32px rgba(15, 23, 42, 0.25);
  }
  .menu img { display: block; width: 100%; }
  .formats { flex: 1; display: flex; flex-direction: column; gap: 14px; }
  .format {
    background: #fff;
    border-radius: 12px;
    padding: 14px 18px;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
  }
  .format .label { font-size: 15px; font-weight: 700; color: #3e4c59; }
  .format code {
    display: block;
    margin-top: 6px;
    font-family: "SF Mono", Menlo, monospace;
    font-size: 14px;
    color: #1d4ed8;
    white-space: pre;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>
</head>
<body>
  <h1>右クリックでページ情報をコピー</h1>
  <p class="lead">タイトルとURLを、用途に合わせた5つの形式でクリップボードへ。</p>
  <div class="main">
    <div class="menu"><img src="../images/screenshot.png" alt=""></div>
    <div class="formats">
      <div class="format"><div class="label">Markdown link</div><code>[記事タイトル](https://example.com/post)</code></div>
      <div class="format"><div class="label">タイトル[改行]URL</div><code>記事タイトル
https://example.com/post</code></div>
      <div class="format"><div class="label">タイトル</div><code>記事タイトル</code></div>
      <div class="format"><div class="label">URL</div><code>https://example.com/post?utm_source=x#top</code></div>
      <div class="format"><div class="label">URL(クエリ文字列除去)</div><code>https://example.com/post</code></div>
    </div>
  </div>
</body>
</html>
